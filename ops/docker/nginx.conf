server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Strict CSP: bundled assets only, no external fonts or CDNs.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","service":"console"}';
    }

    # Same-origin API proxy to core (no CORS needed).
    location /api/ {
        proxy_pass http://core-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
