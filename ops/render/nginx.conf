worker_processes 1;
pid /tmp/safepay/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/safepay/client;
    proxy_temp_path /tmp/safepay/proxy;
    fastcgi_temp_path /tmp/safepay/fastcgi;
    uwsgi_temp_path /tmp/safepay/uwsgi;
    scgi_temp_path /tmp/safepay/scgi;
    # Render terminates TLS and supplies this header. Preserve it through nginx.
    map $http_x_forwarded_proto $original_scheme {
        default $scheme;
        https https;
    }
    server {
        listen __PORT__;
        server_name _;
        root /srv/console;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        location = /healthz {
            if (!-f /tmp/safepay/ready) { return 503; }
            proxy_pass http://127.0.0.1:8000/healthz;
            proxy_set_header Host localhost;
        }
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $original_scheme;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
