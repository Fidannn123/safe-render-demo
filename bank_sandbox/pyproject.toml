[project]
name = "safepay-bank-sandbox"
version = "0.0.0"
description = "SafePay SIMULATED bank: accounts, idempotent transfers, Ed25519-signed receipts and statements."
requires-python = ">=3.13,<3.14"
dependencies = [
  "django>=5.2.18,<5.3",
  "django-ninja>=1.7,<1.8",
  "psycopg[binary]>=3.2,<3.4",
  "argon2-cffi>=25.1,<26",
  "cryptography>=50,<51",
  "rfc8785>=0.1.4,<0.2",
  "pyyaml>=6.0.3,<7",
  "gunicorn>=26,<27",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true

# CLAUDE.md: mypy strict for crypto wrappers (bank attestation + request signing).
[[tool.mypy.overrides]]
module = ["safepay_bank.signing", "safepay_bank.reqsig", "safepay_bank.keys", "safepay_bank.middleware"]
strict = true

[tool.django-stubs]
django_settings_module = "safepay_bank.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "safepay_bank.settings.test"
testpaths = ["tests", "apps"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
