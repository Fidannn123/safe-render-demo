[project]
name = "safepay-sim"
version = "0.0.0"
description = "SafePay simulation: seeded digital twins (SYNTHETIC), scenarios, attacker, B0/B1/B2 harness."
requires-python = ">=3.13,<3.14"
dependencies = [
  "pyyaml>=6.0.3,<7",
  "jsonschema>=4.26,<5",
  "cryptography>=50,<51",
  "rfc8785>=0.1.4,<0.2",
]

[tool.uv]
package = false

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
